<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語クラス - Sakura Edition</title>
    <!-- Google Fonts: Plus Jakarta Sans & Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1528 0%, #2a1b3d 50%, #3d1b35 100%);
            --sakura-pink: #ffb7c5;
            --sakura-light: #fff0f3;
            --sakura-dark: #d45d79;
            --accent: #ff8fa3;
            --card-bg: rgba(45, 30, 50, 0.75);
            --border-color: rgba(255, 183, 197, 0.25);
            --text-main: #fcf6f7;
            --text-muted: #d1b3be;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-attachment: fixed;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--sakura-pink);
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .search-box {
            width: 100%;
            background: rgba(25, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 16px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .search-box:focus {
            border-color: var(--sakura-pink);
            box-shadow: 0 0 12px rgba(255, 183, 197, 0.2);
        }

        .search-box::placeholder {
            color: #8c737d;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 15px;
            max-height: 52vh;
            overflow-y: auto;
            text-align: left;
        }

        .card::-webkit-scrollbar {
            width: 5px;
        }
        .card::-webkit-scrollbar-thumb {
            background: rgba(255, 183, 197, 0.3);
            border-radius: 10px;
        }

        .menu-title {
            font-size: 0.75rem;
            color: var(--sakura-pink);
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            text-transform: uppercase;
        }

        /* Tampilan tombol ringkas (grid/list efisien) */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 11px 14px;
            width: 100%;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn::after {
            content: '🌸';
            font-size: 0.7rem;
            opacity: 0.5;
            transition: transform 0.2s;
        }

        .btn:hover {
            background: rgba(255, 183, 197, 0.12);
            border-color: var(--sakura-pink);
            transform: translateX(2px);
            color: #ffffff;
        }

        .btn:hover::after {
            opacity: 1;
            transform: scale(1.1);
        }

        .result-item {
            background: rgba(20, 12, 20, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
        }

        .result-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .result-info strong {
            color: #ffffff;
            font-size: 1rem;
        }

        .result-info span {
            color: var(--sakura-pink);
        }

        .btn.correct {
            background: rgba(46, 204, 113, 0.2) !important;
            color: #ffffff !important;
            border-color: #2ecc71 !important;
        }

        .btn.correct::after { content: '✨'; opacity: 1; }

        .btn.wrong {
            background: rgba(231, 76, 60, 0.2) !important;
            color: #ffffff !important;
            border-color: #e74c3c !important;
        }

        .btn.wrong::after { content: '✕'; opacity: 1; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .target-tag {
            font-size: 0.7rem;
            color: var(--sakura-pink);
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-align: center;
            text-transform: uppercase;
        }

        .target-word {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
            text-align: center;
        }

        .target-hiragana {
            font-size: 1rem;
            color: var(--sakura-pink);
            margin-bottom: 16px;
            font-weight: 500;
            text-align: center;
        }

        .footer-nav {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            transition: color 0.2s;
            text-align: center;
        }

        .footer-nav:hover {
            color: var(--sakura-pink);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌸 Nihongo Quest</h1>
        <div class="subtitle">Belajar Kotoba Ringkas & Elegan</div>

        <!-- MENU UTAMA -->
        <div id="main-menu">
            <input type="text" id="search-input" class="search-box" placeholder="🔍 Cari kata, arti, atau romaji..." oninput="handleSearch()">
            <div class="card">
                <div class="menu-title" id="menu-status">MEMUAT MATERI...</div>
                <div id="menu-buttons" class="hidden menu-grid"></div>
            </div>
        </div>

        <!-- HALAMAN KUIS -->
        <div id="quiz-section" class="hidden">
            <div class="stats-bar">
                <span id="node-counter">SOAL: 1 / 0</span>
                <span id="score-counter">SKOR: 0</span>
            </div>

            <div class="card" style="max-height: none;">
                <div id="target-category" class="target-tag">TARGET KOTOBA</div>
                <div id="target-word" class="target-word">-</div>
                <div id="target-hiragana" class="target-hiragana"></div>

                <div id="options-container" class="menu-grid"></div>
            </div>

            <div class="footer-nav" onclick="backToMenu()">← KEMBALI KE MENU UTAMA</div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedCategoryName = "";
        let isAnswered = false;
        let groupedCategories = {};

        fetch('kotoba_data.json')
            .then(response => response.text())
            .then(textData => {
                let lines = textData.split('\n');
                let currentCategory = "UMUM";
                let rawData = [];
                
                lines.forEach(line => {
                    let trimmed = line.trim();
                    if (trimmed.startsWith('//')) {
                        currentCategory = trimmed.replace('//', '').trim();
                    } else if (trimmed.startsWith('{') && (trimmed.endsWith('},') || trimmed.endsWith('}'))) {
                        try {
                            let obj = eval('(' + trimmed.replace(/,\s*$/, '') + ')');
                            obj.category = currentCategory;
                            rawData.push(obj);
                        } catch (e) {}
                    }
                });

                // Membersihkan duplikat data persis
                let seenKeys = new Set();
                allData = [];
                rawData.forEach(item => {
                    let uniqueKey = `${(item.jp || '').trim()}_${(item.meaning || '').toLowerCase().trim()}`;
                    if (!seenKeys.has(uniqueKey)) {
                        seenKeys.add(uniqueKey);
                        allData.push(item);
                    }
                });

                if (allData.length > 0) {
                    document.getElementById('menu-status').innerText = 'PILIH KATEGORI MATERI:';
                    processCategories();
                    renderMenuButtons(groupedCategories);
                } else {
                    document.getElementById('menu-status').innerText = 'DATA KOSONG';
                }
            })
            .catch(error => {
                console.error('Gagal memuat data:', error);
                document.getElementById('menu-status').innerText = 'GAGAL MEMUAT FILE';
            });

        function processCategories() {
            let rawCategories = [...new Set(allData.map(item => item.category))];
            groupedCategories = {};

            rawCategories.forEach(cat => {
                let baseName = cat;
                
                // Meringkas dan menyatukan kategori yang mirip agar menu lebih bersih
                let upperCat = cat.toUpperCase();
                if (upperCat.includes('KATA KERJA') || upperCat.includes('VERB')) {
                    baseName = 'KATA KERJA (VERBS)';
                } else if (upperCat.includes('KATA SIFAT') || upperCat.includes('ADJECTIVE')) {
                    baseName = 'KATA SIFAT (ADJECTIVES)';
                } else if (upperCat.includes('BENDA') || upperCat.includes('OBJEK') || upperCat.includes('MAKANAN') || upperCat.includes('RUMAH')) {
                    baseName = 'BENDA & BENDA SEKELILING';
                } else if (upperCat.includes('WAKTU') || upperCat.includes('TANGGAL') || upperCat.includes('BULAN')) {
                    baseName = 'WAKTU & KETERANGAN';
                } else {
                    // Membersihkan nomor bagian agar tidak membuat banyak baris menu pecah
                    baseName = baseName.replace(/-?\s*BAGIAN\s*\d+/i, '').replace(/-\s*\d+$/, '').trim();
                }

                if (!groupedCategories[baseName]) {
                    groupedCategories[baseName] = [];
                }
                if (!groupedCategories[baseName].includes(cat)) {
                    groupedCategories[baseName].push(cat);
                }
            });
        }

        function renderMenuButtons(categoriesToRender) {
            const menuContainer = document.getElementById('menu-buttons');
            menuContainer.innerHTML = '';

            // Tombol utama akses semua data
            const btnAll = document.createElement('button');
            btnAll.className = 'btn';
            btnAll.innerHTML = `<span>🌸 SEMUA KOTOBA</span> <span style="font-size: 0.7rem; background: rgba(255, 183, 197, 0.15); color: var(--sakura-pink); padding: 2px 6px; border-radius: 6px;">${allData.length}</span>`;
            btnAll.onclick = () => startQuiz('ALL');
            menuContainer.appendChild(btnAll);

            Object.keys(categoriesToRender).forEach(baseName => {
                let subCategories = categoriesToRender[baseName];
                let totalWords = allData.filter(item => subCategories.includes(item.category)).length;

                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `<span>🌿 ${baseName}</span> <span style="font-size: 0.7rem; background: rgba(255, 183, 197, 0.1); color: var(--sakura-pink); padding: 2px 6px; border-radius: 6px;">${totalWords}</span>`;
                btn.onclick = () => startQuizGroup(baseName, subCategories);
                menuContainer.appendChild(btn);
            });

            menuContainer.classList.remove('hidden');
        }

        function handleSearch() {
            let keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const menuContainer = document.getElementById('menu-buttons');
            
            if (keyword === "") {
                document.getElementById('menu-status').innerText = 'PILIH KATEGORI MATERI:';
                renderMenuButtons(groupedCategories);
                return;
            }

            let matchedWords = allData.filter(item => 
                (item.meaning && item.meaning.toLowerCase().includes(keyword)) || 
                (item.jp && item.jp.toLowerCase().includes(keyword)) || 
                (item.hiragana && item.hiragana.toLowerCase().includes(keyword)) ||
                (item.romaji && item.romaji.toLowerCase().includes(keyword))
            );

            let uniqueWords = [];
            let seenMeanings = new Set();
            
            matchedWords.forEach(item => {
                let cleanMeaning = item.meaning.toLowerCase().trim();
                if (!seenMeanings.has(cleanMeaning)) {
                    seenMeanings.add(cleanMeaning);
                    uniqueWords.push(item);
                }
            });

            document.getElementById('menu-status').innerText = `HASIL PENCARIAN (${uniqueWords.length}):`;
            menuContainer.innerHTML = '';

            if (uniqueWords.length === 0) {
                menuContainer.innerHTML = `<div style="color: var(--sakura-pink); text-align: center; padding: 12px; font-size: 0.85rem;">KATA TIDAK DITEMUKAN</div>`;
                return;
            }

            uniqueWords.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div class="result-info">
                        <strong>${item.jp}</strong> [ ${item.hiragana || '-'} ]<br>
                        <span style="color: var(--sakura-pink);">Romaji:</span> ${item.romaji || '-'}<br>
                        <span style="color: #a8e6cf; font-weight: 600;">Arti:</span> ${item.meaning}
                    </div>
                `;
                menuContainer.appendChild(div);
            });
        }

        function startQuizGroup(groupName, subCategories) {
            currentQuestions = allData.filter(item => subCategories.includes(item.category));
            selectedCategoryName = groupName;
            initQuiz();
        }

        function startQuiz(category) {
            if (category === 'ALL') {
                currentQuestions = [...allData];
                selectedCategoryName = "SEMUA KOTOBA";
            }
            initQuiz();
        }

        function initQuiz() {
            currentQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('target-category').innerText = `KATEGORI: ${selectedCategoryName.toUpperCase()}`;
            
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            if (currentIndex >= currentQuestions.length) {
                alert(`🌸 Latihan Selesai!\nSkor Akhir Anda: ${score}`);
                backToMenu();
                return;
            }

            const currentObj = currentQuestions[currentIndex];
            
            document.getElementById('node-counter').innerText = `SOAL: ${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('score-counter').innerText = `SKOR: ${score}`;
            document.getElementById('target-word').innerText = currentObj.jp || "-";
            document.getElementById('target-hiragana').innerText = currentObj.hiragana ? `[ ${currentObj.hiragana} ]` : "";

            let options = [currentObj.meaning];
            let poolSameCategory = currentQuestions.filter(item => item.meaning !== currentObj.meaning);
            poolSameCategory.sort(() => Math.random() - 0.5);

            for (let i = 0; i < poolSameCategory.length && options.length < 4; i++) {
                options.push(poolSameCategory[i].meaning);
            }

            if (options.length < 4) {
                let poolGeneral = allData.filter(item => !options.includes(item.meaning));
                poolGeneral.sort(() => Math.random() - 0.5);
                for (let i = 0; i < poolGeneral.length && options.length < 4; i++) {
                    options.push(poolGeneral[i].meaning);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, optionText, currentObj.meaning);
                optionsContainer.appendChild(btn);
            });
        }

            function checkAnswer(buttonElement, selected, correct) {
            if (isAnswered) return;
            isAnswered = true;

            const allButtons = document.querySelectorAll('#options-container .btn');

            if (selected === correct) {
                score += 10;
                buttonElement.classList.add('correct');
            } else {
                buttonElement.classList.add('wrong');
                allButtons.forEach(btn => {
                    if (btn.innerText === correct) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('score-counter').innerText = `SKOR: ${score}`;

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 800);
        }

        function backToMenu() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('search-input').value = "";
            document.getElementById('menu-status').innerText = 'PILIH KATEGORI MATERI:';
            renderMenuButtons(groupedCategories);
        }
    </script>
</body>
</html>
