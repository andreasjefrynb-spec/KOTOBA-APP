<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Quest - Semangat Belajar Kotoba</title>
    <!-- Google Fonts untuk kesan modern dan estetik -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #f43f5e;
            --success: #10b981;
            --error: #ef4444;
            --card-bg: rgba(30, 27, 75, 0.7);
            --border-color: rgba(99, 102, 241, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-attachment: fixed;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
            background: linear-gradient(92.7deg, #3772ff 0%, #cc00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(204, 0, 255, 0.2);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .search-box {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .search-box:focus {
            border-color: #818cf8;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .search-box::placeholder {
            color: #64748b;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            max-height: 55vh;
            overflow-y: auto;
            text-align: left;
        }

        /* Custom Scrollbar untuk Card */
        .card::-webkit-scrollbar {
            width: 6px;
        }
        .card::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 10px;
        }

        .menu-title {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            text-transform: uppercase;
        }

        .btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            width: 100%;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn::after {
            content: '➔';
            font-size: 0.8rem;
            color: #818cf8;
            transition: transform 0.2s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn:hover::after {
            transform: translateX(4px);
            color: #ffffff;
        }

        .result-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .result-item:hover {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(15, 23, 42, 0.9);
        }

        .result-info {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .result-info strong {
            color: #ffffff;
            font-size: 1.1rem;
        }

        .result-info span {
            color: #38bdf8;
        }

        .btn.correct {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: #ffffff !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5) !important;
            border-color: #34d399 !important;
        }

        .btn.correct::after { content: '✔'; color: white; }

        .btn.wrong {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            color: #ffffff !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5) !important;
            border-color: #fca5a5 !important;
        }

        .btn.wrong::after { content: '✖'; color: white; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 15px;
            padding: 0 5px;
            letter-spacing: 0.5px;
        }

        .target-tag {
            font-size: 0.8rem;
            color: #a5b4fc;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-align: center;
            text-transform: uppercase;
        }

        .target-word {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            word-break: break-word;
            text-align: center;
        }

        .target-hiragana {
            font-size: 1.2rem;
            color: #38bdf8;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
        }

        .footer-nav {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.2s;
            text-align: center;
        }

        .footer-nav:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>日本語クラス</h1>
        <div class="subtitle">✨ Semangat Belajar Kotoba ✨</div>

        <!-- MENU UTAMA -->
        <div id="main-menu">
            <input type="text" id="search-input" class="search-box" placeholder="🔍 Cari kata, arti, atau romaji..." oninput="handleSearch()">
            <div class="card">
                <div class="menu-title" id="menu-status">MEMUAT DATA MATERI...</div>
                <div id="menu-buttons" class="hidden"></div>
            </div>
        </div>

        <!-- HALAMAN KUIS -->
        <div id="quiz-section" class="hidden">
            <div class="stats-bar">
                <span id="node-counter">SOAL: 1 / 0</span>
                <span id="score-counter">SKOR: 0</span>
            </div>

            <div class="card" style="max-height: none;">
                <div id="target-category" class="target-tag">TARGET KOTOBA</div>
                <div id="target-word" class="target-word">-</div>
                <div id="target-hiragana" class="target-hiragana"></div>

                <div id="options-container"></div>
            </div>

            <div class="footer-nav" onclick="backToMenu()">⬅ KEMBALI KE MENU UTAMA</div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedCategoryName = "";
        let isAnswered = false;
        let groupedCategories = {};

        fetch('kotoba_data.json')
            .then(response => response.text())
            .then(textData => {
                let lines = textData.split('\n');
                let currentCategory = "UMUM";
                
                lines.forEach(line => {
                    let trimmed = line.trim();
                    if (trimmed.startsWith('//')) {
                        currentCategory = trimmed.replace('//', '').trim();
                    } else if (trimmed.startsWith('{') && (trimmed.endsWith('},') || trimmed.endsWith('}'))) {
                        try {
                            let obj = eval('(' + trimmed.replace(/,\s*$/, '') + ')');
                            obj.category = currentCategory;
                            allData.push(obj);
                        } catch (e) {}
                    }
                });

                if (allData.length > 0) {
                    document.getElementById('menu-status').innerText = 'PILIH MATERI BELAJAR:';
                    processCategories();
                    renderMenuButtons(groupedCategories);
                } else {
                    document.getElementById('menu-status').innerText = 'ERROR: DATA KOSONG';
                }
            })
            .catch(error => {
                console.error('Gagal memuat data:', error);
                document.getElementById('menu-status').innerText = 'ERROR: GALAL MEMUAT FILE';
            });

        function processCategories() {
            let rawCategories = [...new Set(allData.map(item => item.category))];
            groupedCategories = {};

            rawCategories.forEach(cat => {
                let baseName = cat;
                if (cat.includes('Kata Kerja') || cat.toLowerCase().includes('u-verbs') || cat.toLowerCase().includes('ru-verbs')) {
                    baseName = 'KATA KERJA (VERBS)';
                } else if (cat.includes('Kata Sifat')) {
                    baseName = 'KATA SIFAT (ADJECTIVES)';
                } else {
                    baseName = baseName.replace(/-?\s*BAGIAN\s*\d+/i, '').replace(/-\s*\d+$/, '').trim();
                }

                if (!groupedCategories[baseName]) {
                    groupedCategories[baseName] = [];
                }
                groupedCategories[baseName].push(cat);
            });
        }

        function renderMenuButtons(categoriesToRender) {
            const menuContainer = document.getElementById('menu-buttons');
            menuContainer.innerHTML = '';

            const btnAll = document.createElement('button');
            btnAll.className = 'btn';
            btnAll.innerHTML = `<span>🔥 SEMUA KOTOBA (${allData.length} KATA)</span>`;
            btnAll.onclick = () => startQuiz('ALL');
            menuContainer.appendChild(btnAll);

            Object.keys(categoriesToRender).forEach(baseName => {
                let subCategories = categoriesToRender[baseName];
                let totalWords = allData.filter(item => subCategories.includes(item.category)).length;

                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `<span>✨ ${baseName.toUpperCase()}</span> <span style="font-size: 0.8rem; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px;">${totalWords} kata</span>`;
                btn.onclick = () => startQuizGroup(baseName, subCategories);
                menuContainer.appendChild(btn);
            });

            menuContainer.classList.remove('hidden');
        }

        function handleSearch() {
            let keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const menuContainer = document.getElementById('menu-buttons');
            
            if (keyword === "") {
                document.getElementById('menu-status').innerText = 'PILIH MATERI BELAJAR:';
                renderMenuButtons(groupedCategories);
                return;
            }

            let matchedWords = allData.filter(item => 
                (item.meaning && item.meaning.toLowerCase().includes(keyword)) || 
                (item.jp && item.jp.toLowerCase().includes(keyword)) || 
                (item.hiragana && item.hiragana.toLowerCase().includes(keyword)) ||
                (item.romaji && item.romaji.toLowerCase().includes(keyword))
            );

            let uniqueWords = [];
            let seenMeanings = new Set();
            
            matchedWords.forEach(item => {
                let cleanMeaning = item.meaning.toLowerCase().trim();
                if (!seenMeanings.has(cleanMeaning)) {
                    seenMeanings.add(cleanMeaning);
                    uniqueWords.push(item);
                }
            });

            document.getElementById('menu-status').innerText = `HASIL PENCARIAN (${uniqueWords.length} KATA):`;
            menuContainer.innerHTML = '';

            if (uniqueWords.length === 0) {
                menuContainer.innerHTML = `<div style="color: #f87171; text-align: center; padding: 15px; font-weight: 600;">KATA TIDAK DITEMUKAN</div>`;
                return;
            }

            uniqueWords.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div class="result-info">
                        <strong>${item.jp}</strong> [ ${item.hiragana || '-'} ]<br>
                        <span style="color: #38bdf8;">Romaji:</span> ${item.romaji || '-'}<br>
                        <span style="color: #34d399; font-weight: 600;">Arti:</span> ${item.meaning}
                    </div>
                `;
                menuContainer.appendChild(div);
            });
        }

        function startQuizGroup(groupName, subCategories) {
            currentQuestions = allData.filter(item => subCategories.includes(item.category));
            selectedCategoryName = groupName;
            initQuiz();
        }

        function startQuiz(category) {
            if (category === 'ALL') {
                currentQuestions = [...allData];
                selectedCategoryName = "SEMUA KOTOBA";
            }
            initQuiz();
        }

        function initQuiz() {
            currentQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('target-category').innerText = `KATEGORI: ${selectedCategoryName.toUpperCase()}`;
            
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            if (currentIndex >= currentQuestions.length) {
                alert(`🎉 Hebat! Latihan Selesai!\nSkor Akhir Anda: ${score}`);
                backToMenu();
                return;
            }

            const currentObj = currentQuestions[currentIndex];
            
            document.getElementById('node-counter').innerText = `SOAL: ${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('score-counter').innerText = `SKOR: ${score}`;
            document.getElementById('target-word').innerText = currentObj.jp || "-";
            document.getElementById('target-hiragana').innerText = currentObj.hiragana ? `[ ${currentObj.hiragana} ]` : "";

            let options = [currentObj.meaning];
            let poolSameCategory = currentQuestions.filter(item => item.meaning !== currentObj.meaning);
            poolSameCategory.sort(() => Math.random() - 0.5);

            for (let i = 0; i < poolSameCategory.length && options.length < 4; i++) {
                options.push(poolSameCategory[i].meaning);
            }

            if (options.length < 4) {
                let poolGeneral = allData.filter(item => !options.includes(item.meaning));
                poolGeneral.sort(() => Math.random() - 0.5);
                for (let i = 0; i < poolGeneral.length && options.length < 4; i++) {
                    options.push(poolGeneral[i].meaning);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, optionText, currentObj.meaning);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(buttonElement, selected, correct) {
            if (isAnswered) return;
            isAnswered = true;

            const allButtons = document.querySelectorAll('#options-container .btn');

            if (selected === correct) {
                score += 10;
                buttonElement.classList.add('correct');
            } else {
                buttonElement.classList.add('wrong');
                allButtons.forEach(btn => {
                    if (btn.innerText === correct) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('score-counter').innerText = `SKOR: ${score}`;

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 800);
        }

        function backToMenu() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('search-input').value = "";
            document.getElementById('menu-status').innerText = 'PILIH MATERI BELAJAR:';
            renderMenuButtons(groupedCategories);
        }
    </script>
</body>
</html>
