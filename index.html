<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語クラス - Tes Bahasa Jepang</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hiragino Sans', 'Meiryo', 'Segoe UI', sans-serif;
        }
        body {
            background-color: #fcf8f2;
            background-image: radial-gradient(#bc4749 0.75px, transparent 0.75px);
            background-size: 15px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(188, 71, 73, 0.1);
            border-top: 6px solid #bc4749;
            position: relative;
        }
        .japanese-sun {
            width: 50px;
            height: 50px;
            background-color: #bc4749;
            border-radius: 50%;
            margin: 0 auto 15px auto;
        }
        h1 {
            font-size: 1.8rem;
            color: #2b2d42;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2b2d42;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #bc4749;
        }
        .btn-start, .btn-wa {
            width: 100%;
            padding: 14px;
            background-color: #bc4749;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start:hover, .btn-wa:hover {
            background-color: #9b2c2e;
        }
        .header-quiz {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px dashed #f1f3f5;
        }
        .progress-bar {
            font-size: 0.95rem;
            color: #6c757d;
            font-weight: 600;
        }
        .timer {
            font-size: 1rem;
            font-weight: bold;
            color: #bc4749;
            background: #fff5f5;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #ffc9c9;
        }
        .question {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2b2d42;
            margin-bottom: 25px;
            min-height: 60px;
            line-height: 1.6;
            white-space: pre-line;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-option {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #2b2d42;
        }
        .btn-option:hover {
            background-color: #fff5f5;
            border-color: #bc4749;
            color: #bc4749;
        }
        .result-screen {
            display: none;
            text-align: center;
        }
        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: #bc4749;
            margin: 15px 0;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            background: #f1f3f5;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #495057;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="japanese-sun"></div>

    <!-- START SCREEN -->
    <div id="start-screen">
        <h1>日本語クラス</h1>
        <p class="subtitle">Tes Bahasa Jepang Level N5 - N4</p>
        <div class="input-group">
            <label for="username">Nama Lengkap Peserta:</label>
            <input type="text" id="username" placeholder="Masukkan nama Anda..." required>
        </div>
        <button class="btn-start" onclick="startQuiz()">Mulai Tes Now (5 Menit)</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" style="display: none;">
        <div class="header-quiz">
            <div class="progress-bar" id="progress">Soal 1 / 20</div>
            <div class="timer" id="timer">05:00</div>
        </div>
        <div class="question" id="question">Memuat soal...</div>
        <div class="options" id="options"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="result-screen">
        <h1>日本語クラス</h1>
        <p class="subtitle">Tes Telah Selesai</p>
        <div class="score-display" id="final-score">0 / 20</div>
        <div class="status-badge" id="status-text">Memproses jawaban...</div>
        <p style="font-size: 0.9rem; color: #6c757d; margin-bottom: 20px;">Hasil tes Anda otomatis dikirimkan ke WhatsApp penyelenggara.</p>
        <button class="btn-wa" onclick="sendToWhatsApp()">Kirim Ulang ke WhatsApp</button>
    </div>
</div>

<script>
    const TARGET_PHONE = "6281233624841";

    const questions = [
        { question: "わたし ____ たなかです。", options: ["は (ha)", "が (ga)", "を (wo)", "に (ni)"], correct: 0 },
        { question: "まいにち 7じ ____ おきます。", options: ["で (de)", "に (ni)", "へ (he)", "と (to)"], correct: 1 },
        { question: "Apa arti dari kata 「ほん」?", options: ["Buku", "Mobil", "Tas", "Sepatu"], correct: 0 },
        { question: "Apa arti dari kata 「たべもの」?", options: ["Makanan", "Minuman", "Pakaian", "Buah"], correct: 0 },
        { question: "Bentuk lampau positif dari 「たべます」 adalah...", options: ["たべません", "たべました", "たべましょう", "たべたい"], correct: 1 },
        { question: "Bentuk negatif dari kata sifat 「あつい」 adalah...", options: ["あつくない", "あつかない", "あつじゃない", "あつくなかった"], correct: 0 },
        { question: "Bentuk ~te (て形) dari kata kerja 「いきます」 adalah...", options: ["いって", "いきて", "いきて", "いちて"], correct: 0 },
        { question: "Bentuk ~nai (ない形) dari kata kerja 「のみます」 adalah...", options: ["のまない", "のむない", "のわない", "のままない"], correct: 0 },
        { question: "Kata 「はなせます」 (Bentuk Potensial N4) memiliki arti...", options: ["Bisa berbicara", "Sedang berbicara", "Akan berbicara", "Pernah berbicara"], correct: 0 },
        { question: "でんしゃ ____ がっこうへ いきます。", options: ["で (de)", "に (ni)", "を (wo)", "から (kara)"], correct: 0 },
        { question: "Kata sambung 「だから」 dalam bahasa Indonesia berarti...", options: ["Oleh karena itu", "Tetapi", "Kemudian", "Meskipun"], correct: 0 },
        { question: "Bentuk negatif dari kata sifat 「しずか [な]」 adalah...", options: ["しずか じゃない", "しずかくない", "しずか ない", "しずか ではないでした"], correct: 0 },
        { question: "あめが ____、でかけません。 (Pengandaian ~tara N4)", options: ["ふったら", "ふると", "ふれば", "ふらたら"], correct: 0 },
        { question: "みず ____ のみます。", options: ["を (wo)", "が (ga)", "は (ha)", "に (ni)"], correct: 0 },
        { question: "Arti dari kata 「きのう」 adalah...", options: ["Kemarin", "Besok", "Hari ini", "Lusa"], correct: 0 },
        { question: "Arti dari kata 「あした」 adalah...", options: ["Besok", "Kemarin", "Sekarang", "Nanti"], correct: 0 },
        { question: "Bentuk kamus (Jishokei) dari kata kerja 「かいます」 adalah...", options: ["かう", "かい", "かてる", "かわす"], correct: 0 },
        { question: "「べんきょうして おきます」 (Bentuk ~toku N4) artinya...", options: ["Belajar terlebih dahulu (persiapan)", "Coba belajar", "Selesai belajar", "Sedang belajar"], correct: 0 },
        { question: "どれ ____ すきですか。", options: ["が (ga)", "を (wo)", "は (ha)", "に (ni)"], correct: 0 },
        { question: "ひらがなを よむ こと ____ できます。", options: ["が (ga)", "を (wo)", "に (ni)", "で (de)"], correct: 0 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let userName = "";
    let timerInterval = null;
    let timeLeft = 300; // 5 menit = 300 detik
    let isFinished = false;

    function startQuiz() {
        const inputName = document.getElementById('username').value.trim();
        if (!inputName) {
            alert("Harap isi nama Anda terlebih dahulu!");
            return;
        }
        userName = inputName;

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';

        startTimer();
        loadQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishQuiz("Waktu Habis");
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById('progress').innerText = `Soal ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('question').innerText = q.question;
        
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        q.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.classList.add('btn-option');
            btn.innerText = option;
            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        if (isFinished) return;

        if (selectedIndex === questions[currentQuestionIndex].correct) {
            score++;
        }

        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            clearInterval(timerInterval);
            finishQuiz("Selesai Tepat Waktu");
        }
    }

    function finishQuiz(status) {
        isFinished = true;
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
        document.getElementById('status-text').innerText = `Status: ${status}`;

        sendToWhatsApp(status);
    }

    function sendToWhatsApp(status = "Selesai") {
        const message = `*HASIL TES 日本語クラス*\n` +
                        `------------------------------\n` +
                        `Nama Peserta : ${userName}\n` +
                        `Skor Akhir   : ${score} / ${questions.length}\n` +
                        `Status Tes   : ${status}\n` +
                        `------------------------------`;

        const waUrl = `https://wa.me/${TARGET_PHONE}?text=${encodeURIComponent(message)}`;
        window.open(waUrl, '_blank');
    }
</script>

</body>
</html>
