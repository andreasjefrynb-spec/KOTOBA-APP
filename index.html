<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語クラス</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        h1 {
            font-size: 1.6rem;
            color: #1a365d;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        /* Form Registrasi */
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a5568;
        }
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="tel"]:focus {
            border-color: #3182ce;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #2c5282;
        }

        /* Header Quiz */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #edf2f7;
        }
        .user-badge {
            font-weight: 600;
            color: #2b6cb0;
            background-color: #ebf8ff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .progress-text {
            font-size: 0.9rem;
            color: #718096;
            font-weight: 600;
        }

        /* Progress Bar */
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #3182ce;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Question Box */
        .category-tag {
            display: inline-block;
            background-color: #feebc8;
            color: #744210;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .question {
            font-size: 1.15rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            line-height: 1.6;
            white-space: pre-line;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-option {
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #4a5568;
            line-height: 1.4;
        }
        .btn-option:hover:not(:disabled) {
            background-color: #edf2f7;
            border-color: #cbd5e0;
        }
        .btn-option.correct {
            background-color: #c6f6d5 !important;
            border-color: #38a169 !important;
            color: #22543d !important;
            font-weight: bold;
        }
        .btn-option.incorrect {
            background-color: #fed7d7 !important;
            border-color: #e53e3e !important;
            color: #742a2a !important;
        }

        .explanation-box {
            margin-top: 15px;
            padding: 12px 15px;
            background-color: #ebf8ff;
            border-left: 4px solid #3182ce;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #2c5282;
            display: none;
        }

        .btn-next {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .btn-next:hover {
            background-color: #2b6cb0;
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
        }
        .score-box {
            background-color: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #e2e8f0;
        }
        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: #2b6cb0;
        }
        .status-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
        }
        .status-pass {
            background-color: #c6f6d5;
            color: #22543d;
        }
        .status-fail {
            background-color: #fed7d7;
            color: #742a2a;
        }

        .btn-wa {
            width: 100%;
            padding: 14px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
        .btn-wa:hover {
            background-color: #1eb956;
        }

        .btn-restart {
            width: 100%;
            padding: 12px;
            background-color: #718096;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-restart:hover {
            background-color: #4a5568;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- START SCREEN -->
    <div id="start-screen">
        <h1>日本語クラス</h1>
        <p class="subtitle">kalo ga belajar sampe jepang langsung pulang</p>
        
        <form id="start-form" onsubmit="startQuiz(event)">
            <div class="form-group">
                <label for="user-name">あなたの名前 ？ *</label>
                <input type="text" id="user-name" placeholder="..." required>
            </div>
            <div class="form-group">
                <label for="wa-number">Kirim ke 0812-3362-4841</label>
                <input type="tel" id="wa-number" placeholder="...">
                <small style="color:#a0aec0; display:block; margin-top:4px;">がんばってくださいね</small>
            </div>
            <button type="submit" class="btn-primary">Mulai Tes </button>
        </form>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" style="display: none;">
        <div class="quiz-header">
            <span class="user-badge" id="display-user-name">Peserta</span>
            <span class="progress-text" id="progress-text">Soal 1 / 50</span>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>

        <span class="category-tag" id="category-tag">Kategori</span>
        <div class="question" id="question-text">Pertanyaan...</div>
        <div class="options" id="options-container"></div>
        
        <div class="explanation-box" id="explanation-box"></div>

        <button class="btn-next" id="next-btn" onclick="nextQuestion()">Soal Selanjutnya</button>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="result-screen">
        <h1>Hasil Tes JLPT N5</h1>
        <p style="color: #718096; margin-top: 5px;">Selamat telah menyelesaikan tes!</p>

        <div class="score-box">
            <h3 id="result-user-name" style="color: #2d3748; margin-bottom: 10px;">-</h3>
            <div class="score-display" id="final-score">0 / 50</div>
            <div style="font-size: 1.1rem; color: #4a5568; margin-top: 5px;" id="percentage-score">(0%)</div>
            <div id="status-badge" class="status-badge status-pass">LULUS</div>
        </div>

        <p id="feedback-text" style="margin-bottom: 20px; color: #4a5568; line-height: 1.5;"></p>

        <!-- WhatsApp Direct Link -->
        <a id="wa-share-btn" href="#" target="_blank" class="btn-wa">
            💬 Kirim Hasil ke WhatsApp
        </a>

        <button class="btn-restart" onclick="restartQuiz()">Ulangi Tes</button>
    </div>
</div>

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let userName = "";
    let targetWaNumber = "";

    function startQuiz(event) {
        event.preventDefault();
        const nameInput = document.getElementById('user-name').value.trim();
        const waInput = document.getElementById('wa-number').value.trim();

        if (!nameInput) {
            alert("Harap masukkan nama Anda terlebih dahulu.");
            return;
        }

        userName = nameInput;
        targetWaNumber = waInput.replace(/[^0-9]/g, '');

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('display-user-name').innerText = userName;

        currentQuestionIndex = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const nextBtn = document.getElementById('next-btn');
        const expBox = document.getElementById('explanation-box');
        nextBtn.style.display = 'none';
        expBox.style.display = 'none';

        const q = questions[currentQuestionIndex];

        // Update Progress
        const total = questions.length;
        document.getElementById('progress-text').innerText = "Soal " + (currentQuestionIndex + 1) + " / " + total;
        document.getElementById('progress-bar').style.width = (((currentQuestionIndex + 1) / total) * 100) + "%";

        document.getElementById('category-tag').innerText = q.category;
        document.getElementById('question-text').innerText = q.question;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.classList.add('btn-option');
            btn.innerText = option;
            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        if (answered) return;
        answered = true;

        const q = questions[currentQuestionIndex];
        const buttons = document.getElementById('options-container').children;
        const expBox = document.getElementById('explanation-box');

        if (selectedIndex === q.correct) {
            buttons[selectedIndex].classList.add('correct');
            score++;
        } else {
            buttons[selectedIndex].classList.add('incorrect');
            buttons[q.correct].classList.add('correct');
        }

        // Tunjukkan Penjelasan
        if (q.explanation) {
            expBox.innerHTML = "<strong>Penjelasan:</strong> " + q.explanation;
            expBox.style.display = 'block';
        }

        Array.from(buttons).forEach(btn => btn.disabled = true);
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        const resultScreen = document.getElementById('result-screen');
        resultScreen.style.display = 'block';

        const total = questions.length;
        const percentage = Math.round((score / total) * 100);
        const isPassed = percentage >= 60; // Standar kelulusan N5 ~60%

        document.getElementById('result-user-name').innerText = userName;
        document.getElementById('final-score').innerText = score + " / " + total;
        document.getElementById('percentage-score').innerText = "(" + percentage + "%)";

        const statusBadge = document.getElementById('status-badge');
        const feedbackText = document.getElementById('feedback-text');

        if (isPassed) {
            statusBadge.innerText = "LULUS (合格)";
            statusBadge.className = "status-badge status-pass";
            feedbackText.innerText = "おめでとうございます (Selamat, " + userName + ")! Anda memenuhi standar kelulusan 日本語クラス dengan nilai " + percentage + "%.";
        } else {
            statusBadge.innerText = "BELUM LULUS (不合格)";
            statusBadge.className = "status-badge status-fail";
            feedbackText.innerText = "がんばってください (Tetap semangat, " + userName + ")! Nilai Anda " + percentage + "%. Pelajari lagi materi partikel, kanji, dan tata bahasa N5 lalu coba kembali.";
        }

        // Format pesan WA
        const now = new Date();
        const dateStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });

        let waText = "*HASIL TES BAHASA JEPANG JLPT N5*%0A%0A";
        waText += "👤 *Nama Peserta:* " + encodeURIComponent(userName) + "%0A";
        waText += "📅 *Tanggal:* " + encodeURIComponent(dateStr) + "%0A";
        waText += "📊 *Skor Akhir:* " + score + " / " + total + " ( *" + percentage + "%* )%0A";
        waText += "🎯 *Status:* " + encodeURIComponent(isPassed ? "✅ LULUS (合格)" : "❌ BELUM LULUS (不合格)") + "%0A%0A";

        const waBtn = document.getElementById('wa-share-btn');
        if (targetWaNumber) {
            waBtn.href = "https://wa.me/" + targetWaNumber + "?text=" + waText;
        } else {
            waBtn.href = "https://api.whatsapp.com/send?text=" + waText;
        }
    }

    function restartQuiz() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
        document.getElementById('start-form').reset();
    }
