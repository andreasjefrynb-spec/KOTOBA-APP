<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語クラス - CYBER SYSTEM V1.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0b0f0d;
            color: #00ff66;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle, #112216 10%, #0b0f0d 90%);
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #00cc55;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .card {
            background-color: #121814;
            border: 1px solid #1e3323;
            border-radius: 8px;
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .menu-title {
            font-size: 1rem;
            color: #00ff66;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .btn {
            background-color: transparent;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 15px 20px;
            width: 100%;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s ease-in-out;
            text-align: left;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: #00ff66;
            color: #0b0f0d;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #00cc55;
            margin-bottom: 15px;
            padding: 0 5px;
            letter-spacing: 1px;
        }

        .target-tag {
            font-size: 0.8rem;
            color: #008833;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .target-word {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            word-break: break-word;
        }

        /* Styling tambahan untuk Hiragana kecil di bawah Kanji */
        .target-hiragana {
            font-size: 1.1rem;
            color: #00ff66;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .footer-nav {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #00aa55;
            cursor: pointer;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .footer-nav:hover {
            color: #00ff66;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>日本語クラス</h1>
        <div class="subtitle">// CYBER SYSTEM V1.0</div>

        <!-- MENU UTAMA -->
        <div id="main-menu" class="card">
            <div class="menu-title" id="menu-status">LOADING SYSTEM DATA...</div>
            <div id="menu-buttons" class="hidden"></div>
        </div>

        <!-- HALAMAN KUIS -->
        <div id="quiz-section" class="hidden">
            <div class="stats-bar">
                <span id="node-counter">NODE: 1 / 0</span>
                <span id="score-counter">SCORE: 0</span>
            </div>

            <div class="card" style="max-height: none;">
                <div id="target-category" class="target-tag">// TARGET KOTOBA</div>
                <div id="target-word" class="target-word">-</div>
                <div id="target-hiragana" class="target-hiragana"></div>

                <div id="options-container"></div>
            </div>

            <div class="footer-nav" onclick="backToMenu()">[ MENU UTAMA ]</div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedCategoryName = "";

        fetch('kotoba_data.json')
            .then(response => response.text())
            .then(textData => {
                let lines = textData.split('\n');
                let currentCategory = "UMUM";
                
                lines.forEach(line => {
                    let trimmed = line.trim();
                    if (trimmed.startsWith('//')) {
                        currentCategory = trimmed.replace('//', '').trim();
                    } else if (trimmed.startsWith('{') && (trimmed.endsWith('},') || trimmed.endsWith('}'))) {
                        try {
                            let obj = eval('(' + trimmed.replace(/,\s*$/, '') + ')');
                            obj.category = currentCategory;
                            allData.push(obj);
                        } catch (e) {}
                    }
                });

                if (allData.length > 0) {
                    document.getElementById('menu-status').innerText = 'SELECT MISSION MATERI:';
                    generateMenu();
                } else {
                    document.getElementById('menu-status').innerText = 'ERROR: NO DATA PARSED';
                }
            })
            .catch(error => {
                console.error('Gagal memuat data:', error);
                document.getElementById('menu-status').innerText = 'ERROR: FAILED TO LOAD FILE';
            });

        function generateMenu() {
            const menuContainer = document.getElementById('menu-buttons');
            menuContainer.innerHTML = '';

            const categories = [...new Set(allData.map(item => item.category))];

            const btnAll = document.createElement('button');
            btnAll.className = 'btn';
            btnAll.innerHTML = `> // ALL KOTOBA (${allData.length} WORDS)`;
            btnAll.onclick = () => startQuiz('ALL');
            menuContainer.appendChild(btnAll);

            categories.forEach(cat => {
                const count = allData.filter(item => item.category === cat).length;
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `> // ${cat.toUpperCase()} (${count} WORDS)`;
                btn.onclick = () => startQuiz(cat);
                menuContainer.appendChild(btn);
            });

            menuContainer.classList.remove('hidden');
        }

        function startQuiz(category) {
            if (category === 'ALL') {
                currentQuestions = [...allData];
                selectedCategoryName = "ALL KOTOBA";
            } else {
                currentQuestions = allData.filter(item => item.category === category);
                selectedCategoryName = category;
            }

            currentQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('target-category').innerText = `// TARGET (${selectedCategoryName.toUpperCase()})`;
            
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= currentQuestions.length) {
                alert(`Misi Selesai! Skor akhir Anda: ${score}`);
                backTest();
                backToMenu();
                return;
            }

            const currentObj = currentQuestions[currentIndex];
            
            document.getElementById('node-counter').innerText = `NODE: ${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('score-counter').innerText = `SCORE: ${score}`;
            
            // Tampilkan Kanji (jp) di atas, dan Hiragana di bawahnya
            document.getElementById('target-word').innerText = currentObj.jp || "-";
            document.getElementById('target-hiragana').innerText = currentObj.hiragana ? `[ ${currentObj.hiragana} ]` : "";

            let options = [currentObj.meaning];
            while (options.length < 4 && options.length < allData.length) {
                let randomObj = allData[Math.floor(Math.random() * allData.length)];
                if (!options.includes(randomObj.meaning)) {
                    options.push(randomObj.meaning);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(optionText, currentObj.meaning);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                score += 10;
            }
            currentIndex++;
            loadQuestion();
        }

        function backToMenu() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }
    </script>
</body>
</html>
