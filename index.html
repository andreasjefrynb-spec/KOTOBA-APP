<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Tes JLPT N5</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.5rem;
            color: #1a202c;
            text-align: center;
            margin-bottom: 20px;
        }
        .progress-bar {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 15px;
        }
        .question {
            font-size: 1.15rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            min-height: 50px;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-option {
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #4a5568;
        }
        .btn-option:hover:not(:disabled) {
            background-color: #edf2f7;
            border-color: #cbd5e0;
        }
        .btn-option.correct {
            background-color: #c6f6d5;
            border-color: #38a169;
            color: #22543d;
            font-weight: bold;
        }
        .btn-option.incorrect {
            background-color: #fed7d7;
            border-color: #e53e3e;
            color: #742a2a;
        }
        .btn-next {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .btn-next:hover {
            background-color: #2b6cb0;
        }
        .result-screen {
            display: none;
            text-align: center;
        }
        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2b6cb0;
            margin: 15px 0;
        }
        .btn-restart {
            padding: 12px 25px;
            background-color: #38a169;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-restart:hover {
            background-color: #2f855a;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <h1>Tes Bahasa Jepang N5</h1>
        <div class="progress-bar" id="progress">Soal 1 dari 5</div>
        <div class="question" id="question">Pertanyaan...</div>
        <div class="options" id="options"></div>
        <button class="btn-next" id="next-btn" onclick="nextQuestion()">Soal Selanjutnya</button>
    </div>

    <div class="result-screen" id="result-screen">
        <h1>Hasil Tes Anda</h1>
        <div class="score-display" id="final-score">0 / 5</div>
        <p id="feedback-text" style="margin-bottom: 20px; color: #4a5568;"></p>
        <button class="btn-restart" onclick="restartQuiz()">Coba Lagi</button>
    </div>
</div>
