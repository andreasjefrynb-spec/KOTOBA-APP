<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Tebak Kotoba</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .question-box {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin: 25px 0;
            min-height: 40px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .btn-option {
            background-color: #ffffff;
            border: 2px solid #3498db;
            color: #3498db;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .btn-option:hover {
            background-color: #3498db;
            color: white;
        }
        .btn-option.correct {
            background-color: #2ecc71 !important;
            border-color: #2ecc71 !important;
            color: white !important;
        }
        .btn-option.wrong {
            background-color: #e74c3c !important;
            border-color: #e74c3c !important;
            color: white !important;
        }
        #score {
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Tebak Arti Kotoba</h2>
        <div id="question" class="question-box">Memuat data...</div>
        <div id="options" class="options-container"></div>
        <div id="score">Skor: 0</div>
    </div>

    <script>
        let kotobaList = [];
        let currentQuestion = {};
        let score = 0;

        async function loadData() {
            try {
                let response = await fetch('kotoba_data.json');
                if (!response.ok) throw new Error('Gagal mengambil file JSON');
                kotobaList = await response.json();
                nextQuestion();
            } catch (error) {
                document.getElementById('question').innerText = "Gagal memuat data kotoba!";
                console.error(error);
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function nextQuestion() {
            if (kotobaList.length === 0) return;

            // Ambil soal secara acak
            currentQuestion = kotobaList[Math.floor(Math.random() * kotobaList.length)];
            
            // Tampilkan teks Jepang (utamakan 'jp', jika tidak ada pakai 'hiragana' atau 'kanji')
            let displayWord = currentQuestion.jp || currentQuestion.hiragana || currentQuestion.kanji;
            document.getElementById('question').innerText = displayWord;

            // Ambil 3 pilihan jawaban salah secara acak
            let wrongOptions = kotobaList
                .filter(item => (item.meaning || item.arti) !== (currentQuestion.meaning || currentQuestion.arti))
                .map(item => item.meaning || item.arti);
            
            shuffle(wrongOptions);

            let choices = [currentQuestion.meaning || currentQuestion.arti, wrongOptions[0], wrongOptions[1], wrongOptions[2]];
            shuffle(choices);

            // Tampilkan pilihan ke tombol
            let optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            choices.forEach(choice => {
                let btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(btn, choice);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(button, selectedChoice) {
            let correctMeaning = currentQuestion.meaning || currentQuestion.arti;
            let buttons = document.querySelectorAll('.btn-option');
            
            // Matikan semua tombol setelah diklik
            buttons.forEach(btn => btn.disabled = true);

            if (selectedChoice === correctMeaning) {
                button.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = "Skor: " + score;
            } else {
                button.classList.add('wrong');
                // Tunjukkan mana jawaban yang benar
                buttons.forEach(btn => {
                    if (btn.innerText === correctMeaning) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Lanjut ke soal berikutnya setelah 1.2 detik
            setTimeout(() => {
                nextQuestion();
            }, 1200);
        }

        loadData();
    </script>
</body>
</html>
