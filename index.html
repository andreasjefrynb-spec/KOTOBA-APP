<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Bahasa Jepang N5 - N4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.4rem;
            color: #1a202c;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3182ce;
        }
        .btn-start, .btn-wa {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        .btn-wa {
            background-color: #25D366;
            margin-top: 15px;
        }
        .btn-start:hover { background-color: #2b6cb0; }
        .btn-wa:hover { background-color: #1ebc57; }
        
        .header-quiz {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #718096;
            font-weight: 600;
        }
        .timer {
            color: #e53e3e;
            background: #fff5f5;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #feb2b2;
        }
        .question {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            min-height: 50px;
            line-height: 1.5;
            white-space: pre-line;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-option {
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s ease;
            color: #4a5568;
        }
        .btn-option:hover {
            background-color: #edf2f7;
            border-color: #cbd5e0;
        }
        #quiz-screen, #result-screen {
            display: none;
        }
        .result-screen {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Screen 1: Name Input -->
    <div id="start-screen">
        <h1>Tes Bahasa Jepang (N5 - N4)</h1>
        <div class="form-group">
            <label for="username">Nama Lengkap Peserta:</label>
            <input type="text" id="username" placeholder="Masukkan nama Anda..." required>
        </div>
        <button class="btn-start" onclick="startQuiz()">Mulai Tes (5 Menit)</button>
    </div>

    <!-- Screen 2: Quiz -->
    <div id="quiz-screen">
        <div class="header-quiz">
            <span id="progress">Soal 1 dari 20</span>
            <span class="timer" id="timer">05:00</span>
        </div>
        <div class="question" id="question">Pertanyaan...</div>
        <div class="options" id="options"></div>
    </div>

    <!-- Screen 3: Result & WA Redirect -->
    <div class="result-screen" id="result-screen">
        <h1>Tes Selesai!</h1>
        <p style="margin-top: 10px; color: #4a5568;">Terima kasih telah menyelesaikan tes. Hasil jawaban Anda sedang dikirimkan ke WhatsApp.</p>
        <a id="wa-link" href="#" target="_blank" class="btn-wa">Kirim Hasil ke WhatsApp Sekarang</a>
    </div>
</div>

<script>
    const TARGET_WA = "6281233624841";
    let userName = "";
    let currentQuestionIndex = 0;
    let userAnswers = [];
    let timeLeft = 300; // 5 menit = 300 detik
    let timerInterval = null;

    const questions = [
        { question: "わたしは 毎朝 7時____ おきます。", options: ["に", "で", "を", "へ"], correct: 0 },
        { question: "「友達」 cara bacanya adalah...", options: ["ともだち", "うち", "かぞく", "きょうだい"], correct: 0 },
        { question: "ここで 写真を ____ ください。", options: ["とらないで", "とらなくて", "とらない", "とらないの"], correct: 0 },
        { question: "「学校」 cara bacanya adalah...", options: ["がっこう", "がくせい", "きょうしつ", "かいしゃ"], correct: 0 },
        { question: "デパート____ 本と ペンを 買いました。", options: ["で", "に", "を", "から"], correct: 0 },
        { question: "あした 映画を ____ と 思います。", options: ["みよう", "みます", "みる", "みろ"], correct: 0 },
        { question: "Apa arti dari kosakata 「きのう」?", options: ["Kemarin", "Besok", "Hari ini", "Lusa"], correct: 0 },
        { question: "くすりを ____ なければなりません。", options: ["のま", "のみ", "のむ", "のんで"], correct: 0 },
        { question: "兄____ 背が 高いです。", options: ["より", "ほう", "から", "まで"], correct: 0 },
        { question: "「雨」 cara bacanya adalah...", options: ["あめ", "ゆき", "くも", "かぜ"], correct: 0 },
        { question: "雨が ____、でかけません。", options: ["ふったら", "ふると", "ふれば", "ふって"], correct: 0 },
        { question: "Apa arti dari kosakata 「つくえ」?", options: ["Meja", "Kursi", "Pintu", "Jendela"], correct: 0 },
        { question: "先生に 本を ____。", options: ["いただきました", "あげました", "くれました", "やりました"], correct: 0 },
        { question: "友達____ 一緒に 日本へ 行きます。", options: ["と", "に", "で", "を"], correct: 0 },
        { question: "「病院」 cara bacanya adalah...", options: ["びょういん", "びよういん", "えいがかん", "たいしかん"], correct: 0 },
        { question: "この 料理を ____ みます。", options: ["たべて", "たべ", "たべる", "たべた"], correct: 0 },
        { question: "ラジオを ____ ながら 勉強します。", options: ["きき", "きく", "きいて", "きいた"], correct: 0 },
        { question: "Apa arti dari kosakata 「たかい」?", options: ["Tinggi / Mahal", "Rendah / Murah", "Panjang", "Pendek"], correct: 0 },
        { question: "「新幹線」 cara bacanya adalah...", options: ["しんかんせん", "ちかてつ", "ひこうき", "でんしゃ"], correct: 0 },
        { question: "この 本は ____ やすいです。", options: ["よみ", "よむ", "よんで", "よんだ"], correct: 0 }
    ];

    function startQuiz() {
        const inputName = document.getElementById('username').value.trim();
        if (!inputName) {
            alert("Silakan masukkan nama Anda terlebih dahulu!");
            return;
        }
        userName = inputName;

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';

        startTimer();
        loadQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer').innerText = 
                `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishQuiz(true);
            }
        }, 1000);
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById('progress').innerText = `Soal ${currentQuestionIndex + 1} dari ${questions.length}`;
        document.getElementById('question').innerText = `${currentQuestionIndex + 1}. ${q.question}`;
        
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        q.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.classList.add('btn-option');
            btn.innerText = option;
            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        userAnswers.push(selectedIndex);
        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            clearInterval(timerInterval);
            finishQuiz(false);
        }
    }

    function finishQuiz(isTimeout) {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let correctCount = 0;
        let details = "";

        questions.forEach((q, idx) => {
            let userAnsIdx = userAnswers[idx];
            let isCorrect = userAnsIdx === q.correct;
            if (isCorrect) correctCount++;
            
            let userAnsText = userAnsIdx !== undefined ? q.options[userAnsIdx] : "Tidak Dijawab";
            details += `${idx + 1}. Jawaban: ${userAnsText} (${isCorrect ? 'BENAR' : 'SALAH'})\n`;
        });

        let timeUsed = 300 - timeLeft;
        let usedMinutes = Math.floor(timeUsed / 60);
        let usedSeconds = timeUsed % 60;

        let message = `*HASIL TES BAHASA JEPANG (N5-N4)*\n\n`;
        message += `Nama Peserta: ${userName}\n`;
        message += `Status: ${isTimeout ? 'WAKTU HABIS' : 'SELESAI'}\n`;
        message += `Waktu Pengerjaan: ${usedMinutes} m ${usedSeconds} s\n`;
        message += `Skor Akhir: ${correctCount} / ${questions.length}\n\n`;
        message += `*Rincian Jawaban:*\n${details}`;

        let waUrl = `https://api.whatsapp.com/send?phone=${TARGET_WA}&text=${encodeURIComponent(message)}`;
        
        document.getElementById('wa-link').href = waUrl;

        // Otomatis mengarahkan ke WhatsApp
        window.location.href = waUrl;
    }
</script>

</body>
</html>
