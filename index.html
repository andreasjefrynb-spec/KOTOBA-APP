<!-- Panggil file data JavaScript yang sudah dibuat -->
    <script src="kotoba_data.js"></script>

    <script>
        let allData = [];
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedCategoryName = "";
        let isAnswered = false;
        let groupedCategories = {};

        function initApp() {
            // Mengambil data langsung dari variabel allKotobaData yang ada di kotoba_data.js
            let rawData = typeof allKotobaData !== 'undefined' ? allKotobaData : [];
                
            let seenKeys = new Set();
            allData = [];
            rawData.forEach(item => {
                if (!item) return;
                let jp = (item.jp || item.kanji || '').trim();
                let meaning = (item.meaning || item.arti || '').trim();
                let category = (item.category || item.kategori || 'UMUM').trim();
                
                let uniqueKey = `${jp}_${meaning.toLowerCase()}`;
                if (jp && meaning && !seenKeys.has(uniqueKey)) {
                    seenKeys.add(uniqueKey);
                    allData.push({
                        jp: jp,
                        hiragana: item.hiragana || item.read || '',
                        romaji: item.romaji || '',
                        meaning: meaning,
                        category: category
                    });
                }
            });

            if (allData.length > 0) {
                document.getElementById('menu-status').innerText = `PILIH KATEGORI (${allData.length} KATA TERSEDIA):`;
                processMassCategories();
                renderMenuButtons(groupedCategories);
            } else {
                document.getElementById('menu-status').innerText = 'DATA KOSONG / VARIABEL ALLKOTOBADATA TIDAK DITEMUKAN';
            }
        }

        // Jalankan inisialisasi setelah halaman selesai dimuat
        window.onload = initApp;

        // FUNGSI PENGELOMPOKKAN MASAL OTOMATIS (MACRO-CATEGORIES)
        function processMassCategories() {
            groupedCategories = {};

            allData.forEach(item => {
                let cat = (item.category || "UMUM").toUpperCase();
                let macroGroup = "LAIN-LAIN / UMUM";

                if (cat.includes('KERJA') || cat.includes('VERB') || cat.includes('U-VERBS') || cat.includes('RU-VERBS')) {
                    macroGroup = '⚡ KATA KERJA (VERBS)';
                } else if (cat.includes('SIFAT') || cat.includes('ADJECTIVE')) {
                    macroGroup = '✨ KATA SIFAT (ADJECTIVES)';
                } else if (cat.includes('BENDA') || cat.includes('ALAT') || cat.includes('RUMAH') || cat.includes('MAKANAN') || cat.includes('MINUMAN') || cat.includes('PAKAIAN') || cat.includes('TUBUH') || cat.includes('OBJEK') || cat.includes('TEMPAT') || cat.includes('KOTA')) {
                    macroGroup = '📦 BENDA & OBJEK SEKITAR';
                } else if (cat.includes('WAKTU') || cat.includes('HARI') || cat.includes('BULAN') || cat.includes('TANGGAL') || cat.includes('ANGKA') || cat.includes('JUMLAH') || cat.includes('KETERANGAN')) {
                    macroGroup = '⏳ WAKTU, ANGKA & KETERANGAN';
                } else if (cat.includes('SOSIAL') || cat.includes('KELUARGA') || cat.includes('ORANG') || cat.includes('PERASAAN') || cat.includes('EMOSI') || cat.includes('PROFESI') || cat.includes('PEKERJAAN')) {
                    macroGroup = '👥 SOSIAL, ORANG & PERASAAN';
                } else {
                    macroGroup = cat.replace(/-?\s*BAGIAN\s*\d+/i, '').replace(/-\s*\d+$/, '').trim();
                    if (macroGroup === "") macroGroup = "KOTOBA UMUM";
                }

                if (!groupedCategories[macroGroup]) {
                    groupedCategories[macroGroup] = [];
                }
                if (!groupedCategories[macroGroup].includes(item.category)) {
                    groupedCategories[macroGroup].push(item.category);
                }
            });
        }

        function renderMenuButtons(categoriesToRender) {
            const menuContainer = document.getElementById('menu-buttons');
            menuContainer.innerHTML = '';

            const btnAll = document.createElement('button');
            btnAll.className = 'btn';
            btnAll.innerHTML = `<span>🎮 SEMUA KOTOBA (TOTAL)</span> <span style="font-size: 0.7rem; background: rgba(0, 122, 255, 0.1); color: var(--accent-blue); padding: 2px 7px; border-radius: 6px; font-weight: 700;">${allData.length}</span>`;
            btnAll.onclick = () => startQuiz('ALL');
            menuContainer.appendChild(btnAll);

            Object.keys(categoriesToRender).sort().forEach(groupName => {
                let subCategories = categoriesToRender[groupName];
                let totalWords = allData.filter(item => subCategories.includes(item.category)).length;

                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `<span>📂 ${groupName}</span> <span style="font-size: 0.7rem; background: rgba(0, 122, 255, 0.08); color: var(--accent-blue); padding: 2px 6px; border-radius: 6px;">${totalWords}</span>`;
                btn.onclick = () => startQuizGroup(groupName, subCategories);
                menuContainer.appendChild(btn);
            });

            menuContainer.classList.remove('hidden');
        }

        function handleSearch() {
            let keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const menuContainer = document.getElementById('menu-buttons');
            
            if (keyword === "") {
                document.getElementById('menu-status').innerText = `PILIH KATEGORI (${allData.length} KATA TERSEDIA):`;
                renderMenuButtons(groupedCategories);
                return;
            }

            let matchedWords = allData.filter(item => 
                (item.meaning && item.meaning.toLowerCase().includes(keyword)) || 
                (item.jp && item.jp.toLowerCase().includes(keyword)) || 
                (item.hiragana && item.hiragana.toLowerCase().includes(keyword)) ||
                (item.romaji && item.romaji.toLowerCase().includes(keyword))
            );

            let uniqueWords = [];
            let seenMeanings = new Set();
            
            matchedWords.forEach(item => {
                let cleanMeaning = item.meaning.toLowerCase().trim();
                if (!seenMeanings.has(cleanMeaning)) {
                    seenMeanings.add(cleanMeaning);
                    uniqueWords.push(item);
                }
            });

            document.getElementById('menu-status').innerText = `HASIL PENCARIAN (${uniqueWords.length} KATA):`;
            menuContainer.innerHTML = '';

            if (uniqueWords.length === 0) {
                menuContainer.innerHTML = `<div style="color: var(--accent-blue); text-align: center; padding: 12px; font-size: 0.85rem; font-weight: 600;">KATA TIDAK DITEMUKAN</div>`;
                return;
            }

            uniqueWords.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div class="result-info">
                        <strong>${item.jp}</strong> [ ${item.hiragana || '-'} ]<br>
                        <span style="color: var(--accent-blue);">Romaji:</span> ${item.romaji || '-'}<br>
                        <span style="color: #059669; font-weight: 600;">Arti:</span> ${item.meaning}
                    </div>
                `;
                menuContainer.appendChild(div);
            });
        }

        function startQuizGroup(groupName, subCategories) {
            currentQuestions = allData.filter(item => subCategories.includes(item.category));
            selectedCategoryName = groupName;
            initQuiz();
        }

        function startQuiz(category) {
            if (category === 'ALL') {
                currentQuestions = [...allData];
                selectedCategoryName = "SEMUA KOTOBA";
            }
            initQuiz();
        }

        function initQuiz() {
            currentQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('target-category').innerText = `KATEGORI: ${selectedCategoryName.toUpperCase()}`;
            
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            if (currentIndex >= currentQuestions.length) {
                alert(`🎮 Latihan Selesai!\nSkor Akhir Anda: ${score}`);
                backToMenu();
                return;
            }

            const currentObj = currentQuestions[currentIndex];
            
            document.getElementById('node-counter').innerText = `SOAL: ${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('score-counter').innerText = `SKOR: ${score}`;
            document.getElementById('target-word').innerText = currentObj.jp || "-";
            document.getElementById('target-hiragana').innerText = currentObj.hiragana ? `[ ${currentObj.hiragana} ]` : "";

            let options = [currentObj.meaning];
            let poolSameCategory = currentQuestions.filter(item => item.meaning !== currentObj.meaning);
            poolSameCategory.sort(() => Math.random() - 0.5);

            for (let i = 0; i < poolSameCategory.length && options.length < 4; i++) {
                options.push(poolSameCategory[i].meaning);
            }

            if (options.length < 4) {
                let poolGeneral = allData.filter(item => !options.includes(item.meaning));
                poolGeneral.sort(() => Math.random() - 0.5);
                for (let i = 0; i < poolGeneral.length && options.length < 4; i++) {
                    options.push(poolGeneral[i].meaning);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, optionText, currentObj.meaning);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(buttonElement, selected, correct) {
            if (isAnswered) return;
            isAnswered = true;

            const allButtons = document.querySelectorAll('#options-container .btn');

            if (selected === correct) {
                score += 10;
                buttonElement.classList.add('correct');
            } else {
                buttonElement.classList.add('wrong');
                allButtons.forEach(btn => {
                    if (btn.innerText === correct) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('score-counter').innerText = `SKOR: ${score}`;

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 800);
        }

        function backToMenu() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('search-input').value = "";
            document.getElementById('menu-status').innerText = `PILIH KATEGORI (${allData.length} KATA TERSEDIA):`;
            renderMenuButtons(groupedCategories);
        }
    </script>
