<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Quest - Gaming Edition</title>
    <!-- Google Fonts: Orbitron untuk nuansa gaming futuristik & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #130f2c 0%, #05050a 100%);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-purple: #9d00ff;
            --neon-yellow: #f3e600;
            --neon-green: #00ff66;
            --card-bg: rgba(13, 12, 34, 0.85);
            --border-glow: rgba(0, 243, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #a0a6cb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-attachment: fixed;
            padding: 20px;
        }

        /* Scanlines & Grid Overlay ala Game Arcade */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
            animation: fadeIn 0.5s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-purple);
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .search-box {
            width: 100%;
            background: rgba(5, 5, 15, 0.9);
            border: 2px solid var(--neon-cyan);
            color: var(--text-main);
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .search-box:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
        }

        .search-box::placeholder {
            color: #555b88;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 2px solid var(--border-glow);
            border-radius: 14px;
            padding: 30px 24px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 243, 255, 0.05);
            margin-bottom: 20px;
            max-height: 55vh;
            overflow-y: auto;
            text-align: left;
            position: relative;
        }

        /* Sudut Panel ala Sci-Fi UI */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            border-top: 10px solid var(--neon-cyan);
            border-right: 10px solid transparent;
            width: 0; height: 0;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            border-bottom: 10px solid var(--neon-cyan);
            border-left: 10px solid transparent;
            width: 0; height: 0;
        }

        .card::-webkit-scrollbar {
            width: 8px;
        }
        .card::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .menu-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--neon-yellow);
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(243, 230, 0, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(157, 0, 255, 0.1));
            color: var(--text-main);
            border: 1px solid var(--neon-cyan);
            padding: 14px 18px;
            width: 100%;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
        }

        .btn::after {
            content: '▶';
            font-size: 0.75rem;
            color: var(--neon-cyan);
            transition: transform 0.2s;
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #05050a;
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .btn:hover::after {
            transform: translateX(5px);
            color: #05050a;
        }

        .result-item {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .result-item:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
            background: rgba(0, 243, 255, 0.05);
        }

        .result-info {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .result-info strong {
            color: var(--neon-yellow);
            font-size: 1.1rem;
            text-shadow: 0 0 5px rgba(243, 230, 0, 0.3);
        }

        .result-info span {
            color: var(--neon-cyan);
        }

        .btn.correct {
            background: linear-gradient(135deg, #00ff66, #008833) !important;
            color: #05050a !important;
            box-shadow: 0 0 25px var(--neon-green) !important;
            border-color: #fff !important;
        }

        .btn.correct::after { content: '✔'; color: #05050a; }

        .btn.wrong {
            background: linear-gradient(135deg, #ff0055, #990022) !important;
            color: #ffffff !important;
            box-shadow: 0 0 25px var(--neon-pink) !important;
            border-color: #fff !important;
        }

        .btn.wrong::after { content: '✖'; color: #ffffff; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--neon-cyan);
            margin-bottom: 15px;
            padding: 0 5px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
        }

        .target-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--neon-pink);
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
        }

        .target-word {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-purple);
            word-break: break-word;
            text-align: center;
        }

        .target-hiragana {
            font-size: 1.25rem;
            color: var(--neon-yellow);
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 8px rgba(243, 230, 0, 0.4);
        }

        .footer-nav {
            margin-top: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 1.5px;
            transition: all 0.2s;
            text-align: center;
        }

        .footer-nav:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NIHONGO QUEST</h1>
        <div class="subtitle">⚡ ARCADE KOTOBA BATTLE ⚡</div>

        <!-- MENU UTAMA -->
        <div id="main-menu">
            <input type="text" id="search-input" class="search-box" placeholder="🔍 Cari kata, arti, atau romaji..." oninput="handleSearch()">
            <div class="card">
                <div class="menu-title" id="menu-status">MEMUAT DATABASE...</div>
                <div id="menu-buttons" class="hidden"></div>
            </div>
        </div>

        <!-- HALAMAN KUIS -->
        <div id="quiz-section" class="hidden">
            <div class="stats-bar">
                <span id="node-counter">STAGE: 1 / 0</span>
                <span id="score-counter">SCORE: 0</span>
            </div>

            <div class="card" style="max-height: none;">
                <div id="target-category" class="target-tag">TARGET KOTOBA</div>
                <div id="target-word" class="target-word">-</div>
                <div id="target-hiragana" class="target-hiragana"></div>

                <div id="options-container"></div>
            </div>

            <div class="footer-nav" onclick="backToMenu()">◄ KEMBALI KE MENU UTAMA</div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedCategoryName = "";
        let isAnswered = false;
        let groupedCategories = {};

        fetch('kotoba_data.json')
            .then(response => response.text())
            .then(textData => {
                let lines = textData.split('\n');
                let currentCategory = "UMUM";
                let rawData = [];
                
                lines.forEach(line => {
                    let trimmed = line.trim();
                    if (trimmed.startsWith('//')) {
                        currentCategory = trimmed.replace('//', '').trim();
                    } else if (trimmed.startsWith('{') && (trimmed.endsWith('},') || trimmed.endsWith('}'))) {
                        try {
                            let obj = eval('(' + trimmed.replace(/,\s*$/, '') + ')');
                            obj.category = currentCategory;
                            rawData.push(obj);
                        } catch (e) {}
                    }
                });

                // FILTER DUPLIKAT BERDASARKAN KATA & ARTI
                let seenKeys = new Set();
                allData = [];

                rawData.forEach(item => {
                    let uniqueKey = `${(item.jp || '').trim()}_${(item.meaning || '').toLowerCase().trim()}`;
                    if (!seenKeys.has(uniqueKey)) {
                        seenKeys.add(uniqueKey);
                        allData.push(item);
                    }
                });

                if (allData.length > 0) {
                    document.getElementById('menu-status').innerText = 'PILIH STAGE MATERI:';
                    processCategories();
                    renderMenuButtons(groupedCategories);
                } else {
                    document.getElementById('menu-status').innerText = 'ERROR: DATABASE KOSONG';
                }
            })
            .catch(error => {
                console.error('Gagal memuat data:', error);
                document.getElementById('menu-status').innerText = 'ERROR: GAGAL MEMUAT FILE DATABASE';
            });

        function processCategories() {
            let rawCategories = [...new Set(allData.map(item => item.category))];
            groupedCategories = {};

            rawCategories.forEach(cat => {
                let baseName = cat;
                if (cat.includes('Kata Kerja') || cat.toLowerCase().includes('u-verbs') || cat.toLowerCase().includes('ru-verbs')) {
                    baseName = 'KATA KERJA (VERBS)';
                } else if (cat.includes('Kata Sifat')) {
                    baseName = 'KATA SIFAT (ADJECTIVES)';
                } else {
                    baseName = baseName.replace(/-?\s*BAGIAN\s*\d+/i, '').replace(/-\s*\d+$/, '').trim();
                }

                if (!groupedCategories[baseName]) {
                    groupedCategories[baseName] = [];
                }
                groupedCategories[baseName].push(cat);
            });
        }

        function renderMenuButtons(categoriesToRender) {
            const menuContainer = document.getElementById('menu-buttons');
            menuContainer.innerHTML = '';

            const btnAll = document.createElement('button');
            btnAll.className = 'btn';
            btnAll.innerHTML = `<span>🔥 ALL KOTOBA BATTLE (${allData.length} WORDS)</span>`;
            btnAll.onclick = () => startQuiz('ALL');
            menuContainer.appendChild(btnAll);

            Object.keys(categoriesToRender).forEach(baseName => {
                let subCategories = categoriesToRender[baseName];
                let totalWords = allData.filter(item => subCategories.includes(item.category)).length;

                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `<span>⚡ ${baseName.toUpperCase()}</span> <span style="font-size: 0.75rem; background: rgba(0, 243, 255, 0.15); color: var(--neon-cyan); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--neon-cyan);">${totalWords} words</span>`;
                btn.onclick = () => startQuizGroup(baseName, subCategories);
                menuContainer.appendChild(btn);
            });

            menuContainer.classList.remove('hidden');
        }

        function handleSearch() {
            let keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const menuContainer = document.getElementById('menu-buttons');
            
            if (keyword === "") {
                document.getElementById('menu-status').innerText = 'PILIH STAGE MATERI:';
                renderMenuButtons(groupedCategories);
                return;
            }

            let matchedWords = allData.filter(item => 
                (item.meaning && item.meaning.toLowerCase().includes(keyword)) || 
                (item.jp && item.jp.toLowerCase().includes(keyword)) || 
                (item.hiragana && item.hiragana.toLowerCase().includes(keyword)) ||
                (item.romaji && item.romaji.toLowerCase().includes(keyword))
            );

            let uniqueWords = [];
            let seenMeanings = new Set();
            
            matchedWords.forEach(item => {
                let cleanMeaning = item.meaning.toLowerCase().trim();
                if (!seenMeanings.has(cleanMeaning)) {
                    seenMeanings.add(cleanMeaning);
                    uniqueWords.push(item);
                }
            });

            document.getElementById('menu-status').innerText = `SEARCH RESULT (${uniqueWords.length} FOUND):`;
            menuContainer.innerHTML = '';

            if (uniqueWords.length === 0) {
                menuContainer.innerHTML = `<div style="color: var(--neon-pink); text-align: center; padding: 15px; font-weight: 700; font-family: 'Orbitron', sans-serif;">KATA TIDAK DITEMUKAN</div>`;
                return;
            }

            uniqueWords.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div class="result-info">
                        <strong>${item.jp}</strong> [ ${item.hiragana || '-'} ]<br>
                        <span style="color: var(--neon-cyan);">Romaji:</span> ${item.romaji || '-'}<br>
                        <span style="color: var(--neon-green); font-weight: 600;">Arti:</span> ${item.meaning}
                    </div>
                `;
                menuContainer.appendChild(div);
            });
        }

        function startQuizGroup(groupName, subCategories) {
            currentQuestions = allData.filter(item => subCategories.includes(item.category));
            selectedCategoryName = groupName;
            initQuiz();
        }

        function startQuiz(category) {
            if (category === 'ALL') {
                currentQuestions = [...allData];
                selectedCategoryName = "ALL KOTOBA";
            }
            initQuiz();
        }

        function initQuiz() {
            currentQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('target-category').innerText = `STAGE: ${selectedCategoryName.toUpperCase()}`;
            
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            if (currentIndex >= currentQuestions.length) {
                alert(`🎉 MISSION COMPLETE!\nFinal Score: ${score}`);
                backToMenu();
                return;
            }

            const currentObj = currentQuestions[currentIndex];
            
            document.getElementById('node-counter').innerText = `STAGE: ${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('score-counter').innerText = `SCORE: ${score}`;
            document.getElementById('target-word').innerText = currentObj.jp || "-";
            document.getElementById('target-hiragana').innerText = currentObj.hiragana ? `[ ${currentObj.hiragana} ]` : "";

            let options = [currentObj.meaning];
            let poolSameCategory = currentQuestions.filter(item => item.meaning !== currentObj.meaning);
            poolSameCategory.sort(() => Math.random() - 0.5);

            for (let i = 0; i < poolSameCategory.length && options.length < 4; i++) {
                options.push(poolSameCategory[i].meaning);
            }

            if (options.length < 4) {
                let poolGeneral = allData.filter(item => !options.includes(item.meaning));
                poolGeneral.sort(() => Math.random() - 0.5);
                for (let i = 0; i < poolGeneral.length && options.length < 4; i++) {
                    options.push(poolGeneral[i].meaning);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, optionText, currentObj.meaning);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(buttonElement, selected, correct) {
            if (isAnswered) return;
            isAnswered = true;

            const allButtons = document.querySelectorAll('#options-container .btn');

            if (selected === correct) {
                score += 10;
                buttonElement.classList.add('correct');
            } else {
                buttonElement.classList.add('wrong');
                allButtons.forEach(btn => {
                    if (btn.innerText === correct) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('score-counter').innerText = `SCORE: ${score}`;

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 800);
        }

        function backToMenu() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('search-input').value = "";
            document.getElementById('menu-status').innerText = 'PILIH STAGE MATERI:';
            renderMenuButtons(groupedCategories);
        }
    </script>
</body>
</html>
