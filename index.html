<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語クラス - CYBER SYSTEM V1.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0b0f0d;
            color: #00ff66;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle, #112216 10%, #0b0f0d 90%);
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #00cc55;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .search-box {
            width: 100%;
            background-color: #121814;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        .search-box::placeholder {
            color: #008833;
        }

        .card {
            background-color: #121814;
            border: 1px solid #1e3323;
            border-radius: 8px;
            padding: 25px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
            max-height: 60vh;
            overflow-y: auto;
            text-align: left;
        }

        .menu-title {
            font-size: 0.9rem;
            color: #00cc55;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        .btn {
            background-color: transparent;
            color: #00ff66;
            border: 1px solid #1e3323;
            padding: 12px 15px;
            width: 100%;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s ease-in-out;
            text-align: left;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: #00ff66;
            color: #0b0f0d;
            border-color: #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .btn.correct {
            background-color: #00ff66 !important;
            color: #0b0f0d !important;
            box-shadow: 0 0 20px #00ff66;
            border-color: #00ff66;
        }

        .btn.wrong {
            background-color: #ff3333 !important;
            color: #ffffff !important;
            box-shadow: 0 0 20px #ff3333;
            border-color: #ff3333;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #00cc55;
            margin-bottom: 15px;
            padding: 0 5px;
            letter-spacing: 1px;
        }

        .target-tag {
            font-size: 0.8rem;
            color: #008833;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        .target-word {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            word-break: break-word;
            text-align: center;
        }

        .target-hiragana {
            font-size: 1.1rem;
            color: #00ff66;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-align: center;
        }

        .footer-nav {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #00aa55;
            cursor: pointer;
            letter-spacing: 1px;
            transition: color 0.2s;
            text-align: center;
        }

        .footer-nav:hover {
            color: #00ff66;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>日本語クラス</h1>
        <div class="subtitle">// CYBER SYSTEM V1.0</div>

        <!-- MENU UTAMA -->
        <div id="main-menu">
            <input type="text" id="search-input" class="search-box" placeholder="[ KETIK UNTUK CARI KATA / KATEGORI ]..." oninput="filterMenu()">
            <div class="card">
                <div class="menu-title" id="menu-status">LOADING SYSTEM DATA...</div>
                <div id="menu-buttons" class="hidden"></div>
            </div>
        </div>

        <!-- HALAMAN KUIS -->
        <div id="quiz-section" class="hidden">
            <div class="stats-bar">
                <span id="node-counter">NODE: 1 / 0</span>
                <span id="score-counter">SCORE: 0</span>
            </div>

            <div class="card" style="max-height: none;">
                <div id="target-category" class="target-tag">// TARGET KOTOBA</div>
                <div id="target-word" class="target-word">-</div>
                <div id="target-hiragana" class="target-hiragana"></div>

                <div id="options-container"></div>
            </div>

            <div class="footer-nav" onclick="backToMenu()">[ MENU UTAMA ]</div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedCategoryName = "";
        let isAnswered = false;
        let groupedCategories = {};

        fetch('kotoba_data.json')
            .then(response => response.text())
            .then(textData => {
                let lines = textData.split('\n');
                let currentCategory = "UMUM";
                
                lines.forEach(line => {
                    let trimmed = line.trim();
                    if (trimmed.startsWith('//')) {
                        currentCategory = trimmed.replace('//', '').trim();
                    } else if (trimmed.startsWith('{') && (trimmed.endsWith('},') || trimmed.endsWith('}'))) {
                        try {
                            let obj = eval('(' + trimmed.replace(/,\s*$/, '') + ')');
                            obj.category = currentCategory;
                            allData.push(obj);
                        } catch (e) {}
                    }
                });

                if (allData.length > 0) {
                    document.getElementById('menu-status').innerText = 'SELECT MISSION MATERI:';
                    processCategories();
                    renderMenuButtons(groupedCategories);
                } else {
                    document.getElementById('menu-status').innerText = 'ERROR: NO DATA PARSED';
                }
            })
            .catch(error => {
                console.error('Gagal memuat data:', error);
                document.getElementById('menu-status').innerText = 'ERROR: FAILED TO LOAD FILE';
            });

        function processCategories() {
            let rawCategories = [...new Set(allData.map(item => item.category))];
            groupedCategories = {};

            rawCategories.forEach(cat => {
                let baseName = cat;
                if (cat.includes('Kata Kerja') || cat.toLowerCase().includes('u-verbs') || cat.toLowerCase().includes('ru-verbs')) {
                    baseName = 'KATA KERJA (DIVERSIFIKASI)';
                } else if (cat.includes('Kata Sifat')) {
                    baseName = 'KATA SIFAT (I & NA)';
                } else {
                    baseName = baseName.replace(/-?\s*BAGIAN\s*\d+/i, '').replace(/-\s*\d+$/, '').trim();
                }

                if (!groupedCategories[baseName]) {
                    groupedCategories[baseName] = [];
                }
                groupedCategories[baseName].push(cat);
            });
        }

        function renderMenuButtons(categoriesToRender) {
            const menuContainer = document.getElementById('menu-buttons');
            menuContainer.innerHTML = '';

            // Tombol All Kotoba selalu di atas
            const btnAll = document.createElement('button');
            btnAll.className = 'btn';
            btnAll.innerHTML = `> // ALL KOTOBA (${allData.length} WORDS)`;
            btnAll.onclick = () => startQuiz('ALL');
            menuContainer.appendChild(btnAll);

            Object.keys(categoriesToRender).forEach(baseName => {
                let subCategories = categoriesToRender[baseName];
                let totalWords = allData.filter(item => subCategories.includes(item.category)).length;

                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `> // ${baseName.toUpperCase()} (${totalWords} WORDS)`;
                btn.onclick = () => startQuizGroup(baseName, subCategories);
                menuContainer.appendChild(btn);
            });

            menuContainer.classList.remove('hidden');
        }

        function filterMenu() {
            let keyword = document.getElementById('search-input').value.toLowerCase();
            if (keyword.trim() === "") {
                renderMenuButtons(groupedCategories);
                return;
            }

            // Filter kategori yang cocok dengan ketikan judul atau isi artinya
            let filteredGroups = {};
            Object.keys(groupedCategories).forEach(baseName => {
                let subCategories = groupedCategories[baseName];
                let matchedWords = allData.filter(item => 
                    subCategories.includes(item.category) && 
                    (item.meaning.toLowerCase().includes(keyword) || 
                     item.jp.toLowerCase().includes(keyword) || 
                     (item.hiragana && item.hiragana.toLowerCase().includes(keyword)) ||
                     baseName.toLowerCase().includes(keyword))
                );

                if (matchedWords.length > 0 || baseName.toLowerCase().includes(keyword)) {
                    filteredGroups[baseName] = subCategories;
                }
            });

            renderMenuButtons(filteredGroups);
        }

        function startQuizGroup(groupName, subCategories) {
            currentQuestions = allData.filter(item => subCategories.includes(item.category));
            selectedCategoryName = groupName;
            initQuiz();
        }

        function startQuiz(category) {
            if (category === 'ALL') {
                currentQuestions = [...allData];
                selectedCategoryName = "ALL KOTOBA";
            }
            initQuiz();
        }

        function initQuiz() {
            currentQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('target-category').innerText = `// TARGET (${selectedCategoryName.toUpperCase()})`;
            
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            if (currentIndex >= currentQuestions.length) {
                alert(`Misi Selesai! Skor akhir Anda: ${score}`);
                backToMenu();
                return;
            }

            const currentObj = currentQuestions[currentIndex];
            
            document.getElementById('node-counter').innerText = `NODE: ${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('score-counter').innerText = `SCORE: ${score}`;
            document.getElementById('target-word').innerText = currentObj.jp || "-";
            document.getElementById('target-hiragana').innerText = currentObj.hiragana ? `[ ${currentObj.hiragana} ]` : "";

            let options = [currentObj.meaning];
            let poolSameCategory = currentQuestions.filter(item => item.meaning !== currentObj.meaning);
            poolSameCategory.sort(() => Math.random() - 0.5);

            for (let i = 0; i < poolSameCategory.length && options.length < 4; i++) {
                options.push(poolSameCategory[i].meaning);
            }

            if (options.length < 4) {
                let poolGeneral = allData.filter(item => !options.includes(item.meaning));
                poolGeneral.sort(() => Math.random() - 0.5);
                for (let i = 0; i < poolGeneral.length && options.length < 4; i++) {
                    options.push(poolGeneral[i].meaning);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, optionText, currentObj.meaning);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(buttonElement, selected, correct) {
            if (isAnswered) return;
            isAnswered = true;

            const allButtons = document.querySelectorAll('#options-container .btn');

            if (selected === correct) {
                score += 10;
                buttonElement.classList.add('correct');
            } else {
                buttonElement.classList.add('wrong');
                allButtons.forEach(btn => {
                    if (btn.innerText === correct) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('score-counter').innerText = `SCORE: ${score}`;

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 800);
        }

        function backToMenu() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('search-input').value = "";
            renderMenuButtons(groupedCategories);
        }
    </script>
</body>
</html>
